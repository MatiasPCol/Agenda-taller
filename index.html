<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda del taller</title>
<meta name="description" content="Trabajos y fechas de entrega del taller, con recordatorio de lo que se entrega mañana.">
<meta name="theme-color" content="#14233f">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agenda">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: panel de trabajo de un negocio. Barra superior, indicadores, calendario del mes, cajón del día elegido y lista completa agrupada por plazo. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --ink:#111827; --muted:#5b6474; --line:#d8dce3;
  --brand:#14233f; --on-brand:#ffffff; --brand-soft:#b9c3d6;
  --accent:#1d4ed8; --on-accent:#ffffff; --accent-soft:#e6edfd;
  --warn:#a15c00; --warn-bg:#fff4d6; --late:#b42318; --late-bg:#fdecea; --ok:#147a4b;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1117; --surface:#171b24; --ink:#e7eaf0; --muted:#9aa3b2; --line:#2a303c;
    --brand:#0a1222; --on-brand:#ffffff; --brand-soft:#9aa8c2;
    --accent:#7aa2ff; --on-accent:#0a1222; --accent-soft:#1b2740;
    --warn:#f5c04a; --warn-bg:#3a2e10; --late:#ff8a80; --late-bg:#3a1a18; --ok:#5fd3a0; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.6;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
[hidden]{display:none !important}
.bar{background:var(--brand);color:var(--on-brand);padding-top:var(--sat)}
.bar>div{max-width:640px;margin:0 auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.bar h1{font-size:18px;font-weight:600;letter-spacing:.01em}
.bar .date{font-size:13px;color:var(--brand-soft)}
.bar .right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:0}
.status{font-size:12px;color:var(--brand-soft);min-height:16px;text-align:right}
.out{background:none;border:1px solid var(--brand-soft);color:var(--on-brand);border-radius:4px;padding:4px 9px;font-size:12px;font-weight:600}
#root{max-width:640px;margin:0 auto;padding:16px 16px calc(100px + var(--sab));display:flex;flex-direction:column;gap:16px}
.label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cardhead h2{font-size:15px;font-weight:600}

/* Acceso */
.auth{max-width:420px;margin:0 auto;padding:28px 16px calc(40px + var(--sab));display:flex;flex-direction:column;gap:16px}
.auth .card{padding:18px;display:flex;flex-direction:column;gap:12px}
.auth h2{font-size:20px;font-weight:600}
.auth p{margin:0;color:var(--muted);font-size:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.tabs button{background:var(--surface);border:0;padding:10px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.msg{font-size:14px;border-radius:4px;padding:10px 12px}
.msg.ok{background:var(--accent-soft);color:var(--ink)}
.msg.bad{background:var(--late-bg);color:var(--ink);border-left:3px solid var(--late)}

/* Avisos */
.alert{border-radius:6px;padding:11px 14px;font-size:14px;border:1px solid;text-align:left;width:100%;background:none}
.alert b{font-weight:600}
.alert.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--ink)}
.alert.late{background:var(--late-bg);border-color:var(--late);color:var(--ink)}
.alert.calm{background:var(--surface);border-color:var(--line);color:var(--muted)}
.alert.info{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);display:flex;flex-direction:column;gap:8px}
.alerts{display:flex;flex-direction:column;gap:8px}

/* Indicadores */
.kpis{display:grid;grid-template-columns:repeat(4,1fr)}
.kpi{background:none;border:0;border-right:1px solid var(--line);padding:11px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.kpi:last-child{border-right:0}
.kpi b{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kpi.w b{color:var(--warn)} .kpi.l b{color:var(--late)}

/* Calendario */
.nav{display:flex;gap:6px;align-items:center}
.sq{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:36px;height:36px;padding:0 9px;font-weight:600;font-size:13px}
.cal{padding:10px 10px 12px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow span{text-align:center;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;padding-bottom:4px}
.c{position:relative;background:none;border:1px solid transparent;border-radius:4px;height:44px;padding:0;font-family:var(--mono);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.c.has{background:var(--accent-soft)}
.c.hoy{border-color:var(--ink);font-weight:600}
.c[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.c i{position:absolute;right:3px;top:2px;font-style:normal;font-size:10px;font-weight:600;line-height:1}
.c.past{color:var(--muted)}
.c.over i{color:var(--late)}
.c[aria-pressed="true"] i{color:var(--on-accent)}

/* Cajón del día */
.drawer{border-top:3px solid var(--accent)}
.drawer .cardhead h2{font-size:16px}
.badge{font-family:var(--mono);font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:4px;padding:2px 7px;white-space:nowrap}
.rel{font-size:13px;color:var(--muted)}
.body{padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.list{list-style:none;margin:0;padding:0}
.t{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.list .t:last-child{border-bottom:0}
.chk{width:24px;height:24px;border-radius:4px;border:2px solid var(--muted);background:none;display:grid;place-items:center;font-weight:700;font-size:14px;padding:0;margin-top:1px}
.t.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.tt{font-weight:500;overflow-wrap:anywhere}
.t.done .tt{text-decoration:line-through;color:var(--muted)}
.meta{font-size:12px;color:var(--muted);display:flex;gap:4px 10px;flex-wrap:wrap;margin-top:2px}
.meta .who{font-weight:600}
.meta .when{font-family:var(--mono)}
.det{font-size:13px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere;white-space:pre-wrap}
.del{background:none;border:0;color:var(--muted);font-size:12px;font-weight:600;padding:5px 2px;min-height:30px}
.del.sure{color:var(--late)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
label{font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input[type=text],input[type=email],input[type=password],input[type=date],textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:9px 10px;min-height:44px;font-size:16px}
textarea{resize:vertical;min-height:70px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>label{flex:1 1 150px;min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;height:44px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
@media (max-width:480px){.row>label{flex-basis:100%}}
.form{display:flex;flex-direction:column;gap:10px}
.primary{background:var(--accent);color:var(--on-accent);border:0;border-radius:4px;padding:11px 14px;font-weight:600;min-height:46px}
.secondary{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 14px;font-weight:600;min-height:44px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .primary{flex:1 1 180px}
.err{color:var(--late);font-size:13px;font-weight:600}
.group{padding:8px 14px 2px}
.group+.group{border-top:1px solid var(--line)}
.group h3{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:4px;display:flex;justify-content:space-between}
.group.l h3{color:var(--late)} .group.w h3{color:var(--warn)}
.foot{font-size:12px;color:var(--muted);text-align:center}
.fab{position:fixed;right:16px;bottom:calc(16px + var(--sab));z-index:5;background:var(--accent);color:var(--on-accent);border:0;border-radius:6px;padding:13px 18px;font-weight:600;min-height:48px;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.sheet{position:fixed;top:0;left:0;right:0;height:100%;z-index:10;background:rgba(10,18,34,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .form{background:var(--surface);border-radius:10px 10px 0 0;padding:16px 16px calc(16px + var(--sab));width:100%;max-width:640px;max-height:92%;overflow:auto;-webkit-overflow-scrolling:touch}
.sheet .actions{padding-top:6px}
.sheet .actions .secondary{flex:0 0 auto}
.sheet h2{font-size:17px;font-weight:600}
body.lock{overflow:hidden}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + var(--sab));z-index:20;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:6px;font-size:14px;max-width:calc(100% - 32px)}
.loading{padding:40px 16px;text-align:center;color:var(--muted)}
</style></head><body>
<header class="bar"><div><div><h1>Agenda del taller</h1><div class="date" id="hoy-txt"></div></div><div class="right"><div class="status" id="status" aria-live="polite"></div><button class="out" id="salir" hidden>Cerrar sesión</button></div></div></header>

<main id="cargando" class="loading">Cargando…</main>

<main id="acceso" class="auth" hidden>
  <div class="card">
    <h2 id="a-titulo">Entra a tu agenda</h2>
    <p>Tus trabajos quedan guardados en tu cuenta y los ves igual en el celular y en el computador.</p>
    <div class="tabs" role="group" aria-label="Elegir"><button type="button" id="t-entrar" aria-pressed="true">Entrar</button><button type="button" id="t-crear" aria-pressed="false">Crear cuenta</button></div>
    <form class="form" id="a-form" novalidate>
      <label for="a-email">Correo<input type="email" id="a-email" autocomplete="email" inputmode="email" required></label>
      <label for="a-pass">Contraseña<input type="password" id="a-pass" autocomplete="current-password" minlength="6" required></label>
      <div class="msg" id="a-msg" role="alert" hidden></div>
      <button class="primary" type="submit" id="a-btn">Entrar</button>
    </form>
  </div>
</main>

<div id="root" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
'use strict';
var SUPABASE_URL='https://bjhcoyoscmghvgdvfvao.supabase.co';
var SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJqaGNveW9zY21naHZnZHZmdmFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0OTkzNjEsImV4cCI6MjExMDA3NTM2MX0.xBJaC1sZcpyX3a6JppaDWI31kLE5vlefuL5ZxHShaE0';
var $=function(id){return document.getElementById(id);};
var OLD_LS='agenda-taller-v1';
function get(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* ---------- fechas ---------- */
var DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function p(n){return (n<10?'0':'')+n;}
function iso(d){return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function parse(s){var a=s.split('-');return new Date(+a[0],a[1]-1,+a[2]);}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d);}
function largo(s){var d=parse(s);return DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()];}
function corto(s){var d=parse(s);return DIAS[d.getDay()].slice(0,3)+' '+p(d.getDate())+'/'+p(d.getMonth()+1);}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
var TODAY, TOMORROW;
function setToday(){TODAY=iso(new Date());TOMORROW=addDays(TODAY,1);$('hoy-txt').textContent=cap(largo(TODAY));}
setToday();
function diff(s){return Math.round((parse(s)-parse(TODAY))/864e5);}
function relativo(s){var n=diff(s);
  if(n===0)return 'hoy'; if(n===1)return 'mañana'; if(n===-1)return 'ayer';
  return n>1?('en '+n+' días'):('hace '+(-n)+' días');}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function plural(n,a,b){return n+' '+(n===1?a:b);}

/* ---------- avisos cortos ---------- */
var toastTimer=null;
function toast(msg){var t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true;},3500);}
function status(msg){$('status').textContent=msg||'';}

/* ---------- Supabase ---------- */
var sb=null;
try{ if(window.supabase&&window.supabase.createClient) sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY); }catch(e){}

var user=null;
var tasks=[], notes={};
var sel=TODAY, month=TODAY.slice(0,7), formOpen=false, sure=null, sureTimer=null, formErr='', saving=false;
function cacheKey(){return user?'agenda-cache-'+user.id:null;}
function saveCache(){if(user)set(cacheKey(),{tasks:tasks,notes:notes,at:Date.now()});}

function errText(e){
  if(!navigator.onLine)return 'No hay internet. Revisa tu conexión e intenta otra vez.';
  return 'No se pudo guardar. Intenta otra vez.';
}

function loadAll(){
  if(!sb||!user)return Promise.resolve();
  status('Actualizando…');
  return Promise.all([
    sb.from('tasks').select('id,title,client,due,detail,done,created_at').order('due',{ascending:true}).order('created_at',{ascending:true}),
    sb.from('notes').select('day,body')
  ]).then(function(r){
    if(r[0].error||r[1].error)throw r[0].error||r[1].error;
    tasks=r[0].data||[]; notes={};
    (r[1].data||[]).forEach(function(n){notes[n.day]=n.body;});
    saveCache(); status('Al día'); render();
  }).catch(function(){
    status(navigator.onLine?'No se pudo actualizar':'Sin conexión');
  });
}

/* ---------- acceso ---------- */
var mode='entrar';
function setMode(m){
  mode=m;
  $('t-entrar').setAttribute('aria-pressed',m==='entrar');
  $('t-crear').setAttribute('aria-pressed',m==='crear');
  $('a-titulo').textContent=m==='entrar'?'Entra a tu agenda':'Crea tu cuenta';
  $('a-btn').textContent=m==='entrar'?'Entrar':'Crear cuenta';
  $('a-pass').setAttribute('autocomplete',m==='entrar'?'current-password':'new-password');
  authMsg('');
}
function authMsg(t,kind){var m=$('a-msg');m.hidden=!t;m.textContent=t||'';m.className='msg '+(kind||'bad');}
function authError(e){
  var c=(e&&(e.code||''))+' '+(e&&e.message||'');
  if(/invalid_credentials|Invalid login/i.test(c))return 'El correo o la contraseña no coinciden.';
  if(/email_not_confirmed|not confirmed/i.test(c))return 'Primero confirma tu correo con el enlace que te enviamos.';
  if(/user_already_exists|already registered/i.test(c))return 'Ya hay una cuenta con ese correo. Toca "Entrar".';
  if(/weak_password|at least/i.test(c))return 'La contraseña debe tener al menos 6 caracteres.';
  if(/rate|too many|over_email_send/i.test(c))return 'Demasiados intentos. Espera unos minutos y vuelve a intentar.';
  if(!navigator.onLine)return 'No hay internet. Revisa tu conexión.';
  return 'Algo falló. Intenta otra vez.';
}
$('t-entrar').addEventListener('click',function(){setMode('entrar');});
$('t-crear').addEventListener('click',function(){setMode('crear');});
$('a-form').addEventListener('submit',function(e){
  e.preventDefault();
  var email=$('a-email').value.trim(), pass=$('a-pass').value;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){authMsg('Escribe un correo válido.');$('a-email').focus();return;}
  if(pass.length<6){authMsg('La contraseña debe tener al menos 6 caracteres.');$('a-pass').focus();return;}
  if(!sb){authMsg('No se pudo conectar. Revisa tu internet y recarga.');return;}
  var btn=$('a-btn');btn.disabled=true;authMsg('');
  var req=mode==='entrar'
    ?sb.auth.signInWithPassword({email:email,password:pass})
    :sb.auth.signUp({email:email,password:pass,options:{emailRedirectTo:location.origin}});
  req.then(function(r){
    if(r.error){authMsg(authError(r.error));return;}
    if(mode==='crear'&&!r.data.session){
      authMsg('Te enviamos un correo a '+email+'. Abre el enlace para confirmar tu cuenta y luego entra aquí.','ok');
      setMode('entrar');authMsg('Te enviamos un correo a '+email+'. Abre el enlace para confirmar tu cuenta y luego entra aquí.','ok');
    }
  }).catch(function(err){authMsg(authError(err));}).finally(function(){btn.disabled=false;});
});
$('salir').addEventListener('click',function(){
  if(!sb)return;
  try{if(user)localStorage.removeItem(cacheKey());}catch(e){}
  sb.auth.signOut().finally(function(){showAuth();});
});

function showAuth(){
  user=null;tasks=[];notes={};
  $('cargando').hidden=true;$('root').hidden=true;$('acceso').hidden=false;$('salir').hidden=true;status('');
  formOpen=false;document.body.classList.remove('lock');
}
function showApp(u){
  var first=!user||user.id!==u.id;
  user=u;
  $('cargando').hidden=true;$('acceso').hidden=true;$('root').hidden=false;$('salir').hidden=false;
  if(first){
    var c=get(cacheKey());
    if(c&&c.tasks){tasks=c.tasks;notes=c.notes||{};}
    render();
    loadAll();
  }
}

/* ---------- pintar ---------- */
function pend(){return tasks.filter(function(t){return !t.done;});}
function on(day){return tasks.filter(function(t){return t.due===day;});}
function byDue(a,b){return a.due<b.due?-1:a.due>b.due?1:0;}
function names(a){return esc(a.map(function(t){return t.title;}).join(', '));}
function oldLocal(){
  var o=get(OLD_LS);
  if(!o||!o.tasks||get('agenda-importado'))return [];
  return o.tasks.filter(function(t){return !t.example&&t.title&&t.due;});
}
function taskHTML(t,showDate){
  return '<li class="t'+(t.done?' done':'')+'">'
    +'<button class="chk" data-act="toggle" data-id="'+esc(t.id)+'" aria-pressed="'+(t.done?'true':'false')+'" aria-label="'+(t.done?'Marcar como pendiente':'Marcar como entregado')+': '+esc(t.title)+'">'+(t.done?'✓':'')+'</button>'
    +'<div><div class="tt">'+esc(t.title)+'</div><div class="meta">'
    +(showDate?'<span class="when">'+esc(corto(t.due))+'</span><span>'+relativo(t.due)+'</span>':'')
    +(t.client?'<span class="who">'+esc(t.client)+'</span>':'')
    +(t.done?'<span>Entregado</span>':'')+'</div>'
    +(t.detail?'<div class="det">'+esc(t.detail)+'</div>':'')+'</div>'
    +'<button class="del'+(sure===t.id?' sure':'')+'" data-act="del" data-id="'+esc(t.id)+'">'+(sure===t.id?'¿Borrar?':'Borrar')+'</button></li>';
}
function shell(){
  $('root').innerHTML=
   '<section class="alerts" id="alerts" aria-label="Recordatorios"></section>'
  +'<section class="card kpis" id="kpis" aria-label="Resumen"></section>'
  +'<section class="card"><div class="cardhead"><h2 id="mes"></h2><div class="nav"><button class="sq" id="prev" aria-label="Mes anterior">‹</button><button class="sq" id="hoy">Hoy</button><button class="sq" id="next" aria-label="Mes siguiente">›</button></div></div>'
  +'<div class="cal"><div class="dow"><span>lun</span><span>mar</span><span>mié</span><span>jue</span><span>vie</span><span>sáb</span><span>dom</span></div><div class="grid" id="grid"></div></div></section>'
  +'<section class="card drawer" id="cajon"><div class="cardhead"><div><div class="label">Entregas del día</div><h2 id="dia-titulo"></h2><div class="rel" id="dia-rel"></div></div>'
  +'<div class="nav"><span class="badge" id="dia-n"></span><button class="sq" id="dprev" aria-label="Día anterior">‹</button><button class="sq" id="dnext" aria-label="Día siguiente">›</button></div></div>'
  +'<div class="body"><div id="dia-lista"></div>'
  +'<button class="secondary" id="abrir"></button>'
  +'<label for="nota">Notas del día<textarea id="nota" maxlength="2000"></textarea></label></div></section>'
  +'<section class="card" id="todos"><div class="cardhead"><h2>Todos los pendientes</h2></div><div id="todos-lista"></div></section>'
  +'<p class="foot">Los trabajos con más de 3 meses que ya vencieron se borran solos.</p>'
  +'<div class="sheet" id="sheet" hidden><form class="form" id="form" novalidate><h2>Nuevo trabajo</h2>'
  +'<label for="f-title">Trabajo<input type="text" id="f-title" maxlength="120" autocomplete="off"></label>'
  +'<div class="row"><label for="f-due">Fecha de entrega<input type="date" id="f-due"></label><label for="f-client">Cliente (opcional)<input type="text" id="f-client" maxlength="40" autocomplete="off"></label></div>'
  +'<label for="f-detail">Detalles (opcional)<textarea id="f-detail" maxlength="500"></textarea></label>'
  +'<div class="err" id="f-err" role="alert"></div><div class="actions"><button class="primary" type="submit" id="f-save">Guardar trabajo</button><button class="secondary" type="button" id="cerrar">Cancelar</button></div></form></div>'
  +'<button class="fab" id="nuevo">+ Nuevo trabajo</button>';
}
function render(){
  if(!user)return;
  var pd=pend();
  var man=pd.filter(function(t){return t.due===TOMORROW;});
  var hoy=pd.filter(function(t){return t.due===TODAY;});
  var atr=pd.filter(function(t){return t.due<TODAY;}).sort(byDue);

  var a='', old=oldLocal();
  if(old.length)a+='<div class="alert info"><div><b>Encontramos '+plural(old.length,'trabajo guardado','trabajos guardados')+' en este dispositivo.</b> Súbelos a tu cuenta para no perderlos.</div><div class="actions"><button class="primary" id="importar">Subir a mi cuenta</button><button class="secondary" id="descartar">No, gracias</button></div></div>';
  a+=man.length
    ?'<button class="alert warn" data-go="'+TOMORROW+'" role="status"><b>Recordatorio: mañana entregas '+plural(man.length,'trabajo','trabajos')+'.</b> '+names(man)+'</button>'
    :'<div class="alert calm" role="status">Mañana no hay entregas.</div>';
  if(atr.length)a+='<button class="alert late" data-go="'+atr[0].due+'"><b>'+plural(atr.length,'trabajo atrasado','trabajos atrasados')+'.</b> '+names(atr)+'</button>';
  $('alerts').innerHTML=a;

  $('kpis').innerHTML=
    '<button class="kpi" data-go="'+TODAY+'"><b>'+hoy.length+'</b><span>Hoy</span></button>'
   +'<button class="kpi'+(man.length?' w':'')+'" data-go="'+TOMORROW+'"><b>'+man.length+'</b><span>Mañana</span></button>'
   +'<button class="kpi'+(atr.length?' l':'')+'" data-go="'+(atr.length?atr[0].due:TODAY)+'"><b>'+atr.length+'</b><span>Atrasados</span></button>'
   +'<button class="kpi" data-scroll="todos"><b>'+pd.length+'</b><span>Pendientes</span></button>';

  var y=+month.slice(0,4), m=+month.slice(5,7)-1, first=new Date(y,m,1), n=new Date(y,m+1,0).getDate();
  $('mes').textContent=cap(MESES[m])+' '+y;
  var g='', off=(first.getDay()+6)%7, i;
  for(i=0;i<off;i++)g+='<span></span>';
  for(i=1;i<=n;i++){
    var d=month+'-'+p(i), c=on(d).filter(function(t){return !t.done;}).length;
    g+='<button class="c'+(c?' has':'')+(d===TODAY?' hoy':'')+(d<TODAY?' past':'')+(c&&d<TODAY?' over':'')+'" data-go="'+d+'" aria-pressed="'+(d===sel?'true':'false')+'" aria-label="'+esc(largo(d))+(c?', '+plural(c,'pendiente','pendientes'):'')+'">'+i+(c?'<i>'+c+'</i>':'')+'</button>';
  }
  $('grid').innerHTML=g;

  var list=on(sel), lp=list.filter(function(t){return !t.done;}).length;
  $('dia-titulo').textContent=cap(largo(sel));
  $('dia-rel').textContent=relativo(sel);
  $('dia-n').textContent=lp?(lp+' por entregar'):(list.length?'Todo entregado':'Sin entregas');
  $('dia-lista').innerHTML=list.length
    ?'<ul class="list">'+list.map(function(t){return taskHTML(t,false);}).join('')+'</ul>'
    :'<div class="empty">No hay trabajos para entregar este día.</div>';
  var nota=$('nota'); if(document.activeElement!==nota)nota.value=notes[sel]||'';
  $('sheet').hidden=!formOpen; document.body.classList.toggle('lock',formOpen); fitSheet();
  $('abrir').textContent='Añadir trabajo para el '+corto(sel);
  $('f-err').textContent=formErr;
  $('f-save').disabled=saving;

  var groups=[['Atrasados','l',[]],['Hoy','',[]],['Mañana','w',[]],['Próximos 7 días','',[]],['Más adelante','',[]]];
  pd.slice().sort(byDue).forEach(function(t){var k=diff(t.due);groups[k<0?0:k===0?1:k===1?2:k<=7?3:4][2].push(t);});
  var h=groups.filter(function(x){return x[2].length;}).map(function(x){
    return '<div class="group '+x[1]+'"><h3><span>'+x[0]+'</span><span>'+x[2].length+'</span></h3><ul class="list">'+x[2].map(function(t){return taskHTML(t,true);}).join('')+'</ul></div>';
  }).join('');
  $('todos-lista').innerHTML=h||'<div class="body"><div class="empty">No hay trabajos pendientes. Toca "+ Nuevo trabajo" para añadir uno.</div></div>';
}

/* La ventana de nuevo trabajo se ajusta al espacio que deja el teclado */
function fitSheet(){
  var sh=$('sheet'), vv=window.visualViewport; if(!sh)return;
  if(!formOpen||!vv){sh.style.top='';sh.style.height='';return;}
  sh.style.top=vv.offsetTop+'px'; sh.style.height=vv.height+'px';
}
if(window.visualViewport){visualViewport.addEventListener('resize',fitSheet);visualViewport.addEventListener('scroll',fitSheet);}
document.addEventListener('focusin',function(e){if(formOpen&&e.target.closest&&e.target.closest('#form')){setTimeout(function(){fitSheet();e.target.scrollIntoView({block:'nearest'});},300);}});

/* ---------- acciones ---------- */
shell();
function go(day){sel=day;month=day.slice(0,7);render();}
function shiftMonth(k){var d=new Date(+month.slice(0,4),+month.slice(5,7)-1+k,1);month=d.getFullYear()+'-'+p(d.getMonth()+1);render();}
function openSheet(){formOpen=true;formErr='';$('f-due').value=sel;render();$('f-title').focus();}
function closeSheet(){formOpen=false;formErr='';render();}

function toggleTask(id){
  var t=tasks.filter(function(x){return x.id===id;})[0]; if(!t)return;
  t.done=!t.done; saveCache(); render();
  sb.from('tasks').update({done:t.done}).eq('id',id).then(function(r){
    if(r.error)throw r.error;
  }).catch(function(e){t.done=!t.done;saveCache();render();toast(errText(e));});
}
function deleteTask(id){
  var before=tasks.slice();
  tasks=tasks.filter(function(t){return t.id!==id;}); saveCache(); render();
  sb.from('tasks').delete().eq('id',id).then(function(r){
    if(r.error)throw r.error;
  }).catch(function(e){tasks=before;saveCache();render();toast(errText(e));});
}
function importOld(){
  var old=oldLocal(); if(!old.length)return;
  var rows=old.map(function(t){return {title:String(t.title).slice(0,120),client:String(t.subject||'').slice(0,40),due:t.due,detail:String(t.detail||'').slice(0,500),done:!!t.done};});
  status('Subiendo…');
  sb.from('tasks').insert(rows).select('id,title,client,due,detail,done,created_at').then(function(r){
    if(r.error)throw r.error;
    tasks=tasks.concat(r.data||[]); set('agenda-importado',true); saveCache(); render();
    toast(plural(rows.length,'trabajo subido','trabajos subidos')+' a tu cuenta.'); status('Al día');
  }).catch(function(e){toast(errText(e));status('');});
}

$('root').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b)return;
  if(b.dataset.go){go(b.dataset.go);if(!b.classList.contains('c')){$('cajon').scrollIntoView({block:'start'});}return;}
  if(b.dataset.scroll){$(b.dataset.scroll).scrollIntoView({block:'start'});return;}
  var id=b.dataset.id, act=b.dataset.act;
  if(act==='toggle'){toggleTask(id);}
  else if(act==='del'){
    clearTimeout(sureTimer);
    if(sure===id){sure=null;deleteTask(id);}
    else{sure=id;render();sureTimer=setTimeout(function(){sure=null;render();},3000);}
  }
  else if(b.id==='prev'){shiftMonth(-1);}
  else if(b.id==='next'){shiftMonth(1);}
  else if(b.id==='hoy'){go(TODAY);}
  else if(b.id==='dprev'){go(addDays(sel,-1));}
  else if(b.id==='dnext'){go(addDays(sel,1));}
  else if(b.id==='abrir'||b.id==='nuevo'){openSheet();}
  else if(b.id==='cerrar'){closeSheet();}
  else if(b.id==='importar'){importOld();}
  else if(b.id==='descartar'){set('agenda-importado',true);render();}
});
$('sheet').addEventListener('click',function(e){if(e.target===this)closeSheet();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&formOpen)closeSheet();});
$('nota').addEventListener('change',function(){
  var day=sel, v=this.value.trim(), prev=notes[day]||'';
  if(prev===v)return;
  if(v)notes[day]=v; else delete notes[day];
  saveCache();
  var q=v?sb.from('notes').upsert({user_id:user.id,day:day,body:v,updated_at:new Date().toISOString()},{onConflict:'user_id,day'})
         :sb.from('notes').delete().eq('day',day);
  q.then(function(r){if(r.error)throw r.error;status('Nota guardada');})
   .catch(function(e){if(prev)notes[day]=prev;else delete notes[day];saveCache();render();toast(errText(e));});
});
$('form').addEventListener('submit',function(e){
  e.preventDefault();
  if(saving)return;
  var title=$('f-title').value.trim(), due=$('f-due').value;
  if(!title){formErr='Escribe el nombre del trabajo.';render();$('f-title').focus();return;}
  if(!due){formErr='Elige la fecha de entrega.';render();$('f-due').focus();return;}
  formErr='';saving=true;render();
  sb.from('tasks').insert({title:title,client:$('f-client').value.trim(),due:due,detail:$('f-detail').value.trim()})
    .select('id,title,client,due,detail,done,created_at').single()
    .then(function(r){
      if(r.error)throw r.error;
      tasks.push(r.data); saveCache();
      $('f-title').value='';$('f-client').value='';$('f-detail').value='';
      sel=due;month=due.slice(0,7);formOpen=false;
      if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
      toast('Trabajo guardado.');
    })
    .catch(function(err){formErr=errText(err);})
    .finally(function(){saving=false;render();});
});

/* Al volver a la app: actualizar fecha y traer cambios hechos en otro dispositivo */
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible'||!user)return;
  var before=TODAY; setToday(); if(sel===before)sel=TODAY;
  loadAll();
});
window.addEventListener('online',function(){if(user)loadAll();});

/* ---------- arranque ---------- */
if(!sb){
  $('cargando').textContent='No se pudo cargar la agenda. Revisa tu internet y vuelve a abrirla.';
}else{
  sb.auth.onAuthStateChange(function(ev,session){
    setTimeout(function(){ if(session&&session.user)showApp(session.user); else showAuth(); },0);
  });
}

if('serviceWorker' in navigator && location.protocol==='https:'){
  window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});
}
})();
</script>
</body></html>
