<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Agenda del taller</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet"><style id="css">
/* Layout: panel de trabajo de un negocio. Barra superior, fila de indicadores, calendario del mes y debajo el cajón del día elegido; al final la lista completa agrupada por plazo. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --ink:#111827; --muted:#5b6474; --line:#d8dce3;
  --brand:#14233f; --on-brand:#ffffff; --brand-soft:#b9c3d6;
  --accent:#1d4ed8; --on-accent:#ffffff; --accent-soft:#e6edfd;
  --warn:#a15c00; --warn-bg:#fff4d6; --late:#b42318; --late-bg:#fdecea; --ok:#147a4b;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1117; --surface:#171b24; --ink:#e7eaf0; --muted:#9aa3b2; --line:#2a303c;
    --brand:#0a1222; --on-brand:#ffffff; --brand-soft:#9aa8c2;
    --accent:#7aa2ff; --on-accent:#0a1222; --accent-soft:#1b2740;
    --warn:#f5c04a; --warn-bg:#3a2e10; --late:#ff8a80; --late-bg:#3a1a18; --ok:#5fd3a0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#171b24; --ink:#e7eaf0; --muted:#9aa3b2; --line:#2a303c;
  --brand:#0a1222; --on-brand:#ffffff; --brand-soft:#9aa8c2;
  --accent:#7aa2ff; --on-accent:#0a1222; --accent-soft:#1b2740;
  --warn:#f5c04a; --warn-bg:#3a2e10; --late:#ff8a80; --late-bg:#3a1a18; --ok:#5fd3a0; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.bar{background:var(--brand);color:var(--on-brand)}
.bar>div{max-width:640px;margin:0 auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.bar h1{font-size:18px;font-weight:600;letter-spacing:.01em}
.bar .date{font-size:13px;color:var(--brand-soft)}
.status{font-size:12px;color:var(--brand-soft);min-height:16px}
#root{max-width:640px;margin:0 auto;padding:16px 16px 56px;display:flex;flex-direction:column;gap:16px}
.label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cardhead h2{font-size:15px;font-weight:600}

/* Recordatorio */
.alert{border-radius:6px;padding:11px 14px;font-size:14px;border:1px solid;text-align:left;width:100%;background:none}
.alert b{font-weight:600}
.alert.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--ink)}
.alert.late{background:var(--late-bg);border-color:var(--late);color:var(--ink)}
.alert.calm{background:var(--surface);border-color:var(--line);color:var(--muted)}
.alerts{display:flex;flex-direction:column;gap:8px}

/* Indicadores */
.kpis{display:grid;grid-template-columns:repeat(4,1fr)}
.kpi{background:none;border:0;border-right:1px solid var(--line);padding:11px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.kpi:last-child{border-right:0}
.kpi b{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kpi.w b{color:var(--warn)} .kpi.l b{color:var(--late)}

/* Calendario */
.nav{display:flex;gap:6px;align-items:center}
.sq{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:34px;height:34px;padding:0 9px;font-weight:600;font-size:13px}
.cal{padding:10px 10px 12px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow span{text-align:center;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;padding-bottom:4px}
.c{position:relative;background:none;border:1px solid transparent;border-radius:4px;height:44px;padding:0;font-family:var(--mono);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.c.has{background:var(--accent-soft)}
.c.hoy{border-color:var(--ink);font-weight:600}
.c[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.c i{position:absolute;right:3px;top:2px;font-style:normal;font-size:10px;font-weight:600;line-height:1}
.c.past{color:var(--muted)}
.c.over i{color:var(--late)}
.c[aria-pressed="true"] i{color:var(--on-accent)}

/* Cajón del día */
.drawer{border-top:3px solid var(--accent)}
.drawer .cardhead h2{font-size:16px}
.badge{font-family:var(--mono);font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:4px;padding:2px 7px;white-space:nowrap}
.rel{font-size:13px;color:var(--muted)}
.body{padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.list{list-style:none;margin:0;padding:0}
.t{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.list .t:last-child{border-bottom:0}
.chk{width:24px;height:24px;border-radius:4px;border:2px solid var(--muted);background:none;display:grid;place-items:center;font-weight:700;font-size:14px;padding:0;margin-top:1px}
.t.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.tt{font-weight:500;overflow-wrap:anywhere}
.t.done .tt{text-decoration:line-through;color:var(--muted)}
.meta{font-size:12px;color:var(--muted);display:flex;gap:4px 10px;flex-wrap:wrap;margin-top:2px}
.meta .who{font-weight:600}
.meta .when{font-family:var(--mono)}
.det{font-size:13px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere;white-space:pre-wrap}
.del{background:none;border:0;color:var(--muted);font-size:12px;font-weight:600;padding:5px 2px;min-height:30px}
.del.sure{color:var(--late)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
label{font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input[type=text],input[type=date],textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:9px 10px;min-height:42px;font-size:15px}
textarea{resize:vertical;min-height:70px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>label{flex:1 1 150px}
.form{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.form[hidden]{display:none}
.primary{background:var(--accent);color:var(--on-accent);border:0;border-radius:4px;padding:11px 14px;font-weight:600;min-height:44px}
.secondary{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 14px;font-weight:600;min-height:44px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .primary{flex:1 1 180px}
.err{color:var(--late);font-size:13px;font-weight:600}
.group{padding:8px 14px 2px}
.group+.group{border-top:1px solid var(--line)}
.group h3{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:4px;display:flex;justify-content:space-between}
.group.l h3{color:var(--late)} .group.w h3{color:var(--warn)}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px}
#root{padding-bottom:100px}
.fab{position:fixed;right:16px;bottom:16px;z-index:5;background:var(--accent);color:var(--on-accent);border:0;border-radius:6px;padding:13px 18px;font-weight:600;min-height:48px;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(10,18,34,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .form{background:var(--surface);border:0;border-radius:10px 10px 0 0;padding:16px;width:100%;max-width:640px;max-height:92%;overflow:auto}
.sheet h2{font-size:17px;font-weight:600}
body.lock{overflow:hidden}
</style></head><body><div id="root"></div><script type="application/json" id="state">{"rev":1794498003945,"notes":{},"tasks":[{"id":"tmwdplufd","title":"Ventana x personas","subject":"","due":"2026-11-15","detail":"","done":false}]}</script><script id="app">
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var LS='agenda-taller-v1', SS='agenda-taller-sesion';
function get(store,k){try{return JSON.parse(window[store].getItem(k));}catch(e){return null;}}
function set(store,k,v){try{window[store].setItem(k,JSON.stringify(v));}catch(e){}}

/* ---------- fechas ---------- */
var DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function p(n){return (n<10?'0':'')+n;}
function iso(d){return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function parse(s){var a=s.split('-');return new Date(+a[0],a[1]-1,+a[2]);}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d);}
function largo(s){var d=parse(s);return DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()];}
function corto(s){var d=parse(s);return DIAS[d.getDay()].slice(0,3)+' '+p(d.getDate())+'/'+p(d.getMonth()+1);}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
var TODAY=iso(new Date()), TOMORROW=addDays(TODAY,1);
function diff(s){return Math.round((parse(s)-parse(TODAY))/864e5);}
function relativo(s){var n=diff(s);
  if(n===0)return 'hoy'; if(n===1)return 'mañana'; if(n===-1)return 'ayer';
  return n>1?('en '+n+' días'):('hace '+(-n)+' días');}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function plural(n,a,b){return n+' '+(n===1?a:b);}

/* ---------- estado ---------- */
var embedded={}; try{embedded=JSON.parse($('state').textContent)||{};}catch(e){}
var local=get('localStorage',LS);
var state=(local&&local.tasks&&(local.rev||0)>(embedded.rev||0))?local:embedded;
if(!state.tasks)state={rev:0,notes:{},tasks:[]};
if(!state.notes)state.notes={};
var ses=get('sessionStorage',SS)||{};
var sel=ses.sel||TODAY, month=ses.month||sel.slice(0,7), formOpen=!!ses.formOpen;
var sure=null, sureTimer=null, formErr='';

function pend(){return state.tasks.filter(function(t){return !t.done;});}
function on(day){return state.tasks.filter(function(t){return t.due===day;});}
function byDue(a,b){return a.due<b.due?-1:a.due>b.due?1:0;}

/* ---------- guardar ---------- */
var artP=null, pubTimer=null;
function art(){
  if(!artP){artP=(window.claude&&typeof window.claude.use==='function')?window.claude.use('artifact').catch(function(){return null;}):null;}
  return artP||Promise.resolve(null);
}
function status(msg){var el=$('status');if(el)el.textContent=msg;}
function buildDoc(){
  var css=$('css').textContent, js=$('app').textContent;
  var data=JSON.stringify(state).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Agenda del taller</title>'
    +'<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">'
    +'<style id="css">'+css+'</sty'+'le></head><body><div id="root"></div><script type="application/json" id="state">'+data+'</scr'+'ipt><script id="app">'+js+'</scr'+'ipt></body></html>';
}
function typing(){var a=document.activeElement;return !!(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&a.type!=='date');}
function publishSoon(ms){clearTimeout(pubTimer);status('Guardando…');pubTimer=setTimeout(doPublish,ms||1200);}
function doPublish(){
  if(typing()){publishSoon(1500);return;}
  art().then(function(a){
    if(!a){status('Guardado en este dispositivo');return;}
    saveSession(true);
    return a.publish(buildDoc()).then(function(){status('Guardado');});
  }).catch(function(){status('Guardado solo en este dispositivo');});
}
function commit(){state.rev=Date.now();set('localStorage',LS,state);render();publishSoon();}
function saveSession(withScroll){
  var f=$('f-title');
  ses={sel:sel,month:month,formOpen:formOpen,
       draft:f?{title:f.value,subject:$('f-subject').value,due:$('f-due').value,detail:$('f-detail').value}:ses.draft,
       scroll:withScroll?window.scrollY:0};
  set('sessionStorage',SS,ses);
}

/* ---------- pintar ---------- */
function taskHTML(t,showDate){
  return '<li class="t'+(t.done?' done':'')+'">'
    +'<button class="chk" data-act="toggle" data-id="'+esc(t.id)+'" aria-pressed="'+(t.done?'true':'false')+'" aria-label="'+(t.done?'Marcar como pendiente':'Marcar como entregado')+': '+esc(t.title)+'">'+(t.done?'✓':'')+'</button>'
    +'<div><div class="tt">'+esc(t.title)+'</div><div class="meta">'
    +(showDate?'<span class="when">'+esc(corto(t.due))+'</span><span>'+relativo(t.due)+'</span>':'')
    +(t.subject?'<span class="who">'+esc(t.subject)+'</span>':'')
    +(t.done?'<span>Entregado</span>':'')+'</div>'
    +(t.detail?'<div class="det">'+esc(t.detail)+'</div>':'')+'</div>'
    +'<button class="del'+(sure===t.id?' sure':'')+'" data-act="del" data-id="'+esc(t.id)+'">'+(sure===t.id?'¿Borrar?':'Borrar')+'</button></li>';
}
function names(a){return esc(a.map(function(t){return t.title;}).join(', '));}
function render(){
  var pd=pend();
  var man=pd.filter(function(t){return t.due===TOMORROW;});
  var hoy=pd.filter(function(t){return t.due===TODAY;});
  var atr=pd.filter(function(t){return t.due<TODAY;}).sort(byDue);

  var a='';
  a+=man.length
    ?'<button class="alert warn" data-go="'+TOMORROW+'" role="status"><b>Recordatorio: mañana entregas '+plural(man.length,'trabajo','trabajos')+'.</b> '+names(man)+'</button>'
    :'<div class="alert calm" role="status">Mañana no hay entregas.</div>';
  if(atr.length)a+='<button class="alert late" data-go="'+atr[0].due+'"><b>'+plural(atr.length,'trabajo atrasado','trabajos atrasados')+'.</b> '+names(atr)+'</button>';
  $('alerts').innerHTML=a;

  $('kpis').innerHTML=
    '<button class="kpi" data-go="'+TODAY+'"><b>'+hoy.length+'</b><span>Hoy</span></button>'
   +'<button class="kpi'+(man.length?' w':'')+'" data-go="'+TOMORROW+'"><b>'+man.length+'</b><span>Mañana</span></button>'
   +'<button class="kpi'+(atr.length?' l':'')+'" data-go="'+(atr.length?atr[0].due:TODAY)+'"><b>'+atr.length+'</b><span>Atrasados</span></button>'
   +'<button class="kpi" data-scroll="todos"><b>'+pd.length+'</b><span>Pendientes</span></button>';

  /* calendario */
  var y=+month.slice(0,4), m=+month.slice(5,7)-1, first=new Date(y,m,1), n=new Date(y,m+1,0).getDate();
  $('mes').textContent=cap(MESES[m])+' '+y;
  var g='', off=(first.getDay()+6)%7, i;
  for(i=0;i<off;i++)g+='<span></span>';
  for(i=1;i<=n;i++){
    var d=month+'-'+p(i), c=on(d).filter(function(t){return !t.done;}).length;
    g+='<button class="c'+(c?' has':'')+(d===TODAY?' hoy':'')+(d<TODAY?' past':'')+(c&&d<TODAY?' over':'')+'" data-go="'+d+'" aria-pressed="'+(d===sel?'true':'false')+'" aria-label="'+esc(largo(d))+(c?', '+plural(c,'pendiente','pendientes'):'')+'">'+i+(c?'<i>'+c+'</i>':'')+'</button>';
  }
  $('grid').innerHTML=g;

  /* cajón */
  var list=on(sel), lp=list.filter(function(t){return !t.done;}).length;
  $('dia-titulo').textContent=cap(largo(sel));
  $('dia-rel').textContent=relativo(sel);
  $('dia-n').textContent=lp?(lp+' por entregar'):(list.length?'Todo entregado':'Sin entregas');
  $('dia-lista').innerHTML=list.length
    ?'<ul class="list">'+list.map(function(t){return taskHTML(t,false);}).join('')+'</ul>'
    :'<div class="empty">No hay trabajos para entregar este día.</div>';
  var nota=$('nota'); if(document.activeElement!==nota)nota.value=state.notes[sel]||'';
  $('sheet').hidden=!formOpen; document.body.classList.toggle('lock',formOpen);
  $('abrir').textContent='Añadir trabajo para el '+corto(sel);
  $('f-err').textContent=formErr;

  /* todos */
  var groups=[['Atrasados','l',[]],['Hoy','',[]],['Mañana','w',[]],['Próximos 7 días','',[]],['Más adelante','',[]]];
  pd.slice().sort(byDue).forEach(function(t){var k=diff(t.due);groups[k<0?0:k===0?1:k===1?2:k<=7?3:4][2].push(t);});
  var h=groups.filter(function(x){return x[2].length;}).map(function(x){
    return '<div class="group '+x[1]+'"><h3><span>'+x[0]+'</span><span>'+x[2].length+'</span></h3><ul class="list">'+x[2].map(function(t){return taskHTML(t,true);}).join('')+'</ul></div>';
  }).join('');
  $('todos-lista').innerHTML=h||'<div class="body"><div class="empty">No hay trabajos pendientes.</div></div>';
  $('quitar').hidden=!state.tasks.some(function(t){return t.example;});
}

function shell(){
  document.body.insertAdjacentHTML('afterbegin','<div class="bar" id="bar"><div><div><h1>Agenda del taller</h1><div class="date">'+esc(cap(largo(TODAY)))+'</div></div><div class="status" id="status" aria-live="polite"></div></div></div>');
  $('root').innerHTML=
   '<section class="alerts" id="alerts" aria-label="Recordatorios"></section>'
  +'<section class="card kpis" id="kpis" aria-label="Resumen"></section>'
  +'<section class="card"><div class="cardhead"><h2 id="mes"></h2><div class="nav"><button class="sq" id="prev" aria-label="Mes anterior">‹</button><button class="sq" id="hoy">Hoy</button><button class="sq" id="next" aria-label="Mes siguiente">›</button></div></div>'
  +'<div class="cal"><div class="dow"><span>lun</span><span>mar</span><span>mié</span><span>jue</span><span>vie</span><span>sáb</span><span>dom</span></div><div class="grid" id="grid"></div></div></section>'
  +'<section class="card drawer" id="cajon"><div class="cardhead"><div><div class="label">Entregas del día</div><h2 id="dia-titulo"></h2><div class="rel" id="dia-rel"></div></div>'
  +'<div class="nav"><span class="badge" id="dia-n"></span><button class="sq" id="dprev" aria-label="Día anterior">‹</button><button class="sq" id="dnext" aria-label="Día siguiente">›</button></div></div>'
  +'<div class="body"><div id="dia-lista"></div>'
  +'<button class="secondary" id="abrir"></button>'
  +'<div class="sheet" id="sheet" hidden><form class="form" id="form" novalidate><h2>Nuevo trabajo</h2>'
  +'<label for="f-title">Trabajo<input type="text" id="f-title" maxlength="120" autocomplete="off"></label>'
  +'<div class="row"><label for="f-due">Fecha de entrega<input type="date" id="f-due"></label><label for="f-subject">Cliente (opcional)<input type="text" id="f-subject" maxlength="40" autocomplete="off"></label></div>'
  +'<label for="f-detail">Detalles (opcional)<textarea id="f-detail" maxlength="500"></textarea></label>'
  +'<div class="err" id="f-err" role="alert"></div><div class="actions"><button class="primary" type="submit">Guardar trabajo</button><button class="secondary" type="button" id="cerrar">Cancelar</button></div></form></div>'
  +'<label for="nota">Notas del día<textarea id="nota"></textarea></label></div></section>'
  +'<section class="card" id="todos"><div class="cardhead"><h2>Todos los pendientes</h2><button class="link" id="quitar" hidden>Quitar ejemplos</button></div><div id="todos-lista"></div></section>'
  +'<button class="fab" id="nuevo">+ Nuevo trabajo</button>';
}

/* ---------- acciones ---------- */
function go(day){sel=day;month=day.slice(0,7);$('f-due').value=day;saveSession(false);render();}
function shiftMonth(k){var d=new Date(+month.slice(0,4),+month.slice(5,7)-1+k,1);month=d.getFullYear()+'-'+p(d.getMonth()+1);saveSession(false);render();}
shell();
var dr=ses.draft||{};
$('f-title').value=dr.title||''; $('f-subject').value=dr.subject||''; $('f-detail').value=dr.detail||''; $('f-due').value=dr.due||sel;
render();
if(ses.scroll){window.scrollTo(0,ses.scroll);}

$('root').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b)return;
  if(b.dataset.go){go(b.dataset.go);if(!b.classList.contains('c')){$('cajon').scrollIntoView({block:'start'});}return;}
  if(b.dataset.scroll){$(b.dataset.scroll).scrollIntoView({block:'start'});return;}
  var id=b.dataset.id, act=b.dataset.act;
  if(act==='toggle'){state.tasks.forEach(function(t){if(t.id===id)t.done=!t.done;});commit();}
  else if(act==='del'){
    clearTimeout(sureTimer);
    if(sure===id){sure=null;state.tasks=state.tasks.filter(function(t){return t.id!==id;});commit();}
    else{sure=id;render();sureTimer=setTimeout(function(){sure=null;render();},3000);}
  }
  else if(b.id==='quitar'){state.tasks=state.tasks.filter(function(t){return !t.example;});commit();}
  else if(b.id==='prev'){shiftMonth(-1);}
  else if(b.id==='next'){shiftMonth(1);}
  else if(b.id==='hoy'){go(TODAY);}
  else if(b.id==='dprev'){go(addDays(sel,-1));}
  else if(b.id==='dnext'){go(addDays(sel,1));}
  else if(b.id==='abrir'||b.id==='nuevo'){formOpen=true;formErr='';$('f-due').value=sel;saveSession(false);render();$('f-title').focus();}
  else if(b.id==='cerrar'){formOpen=false;formErr='';saveSession(false);render();}
});
$('nota').addEventListener('change',function(){
  var v=this.value.trim(); if((state.notes[sel]||'')===v)return;
  if(v)state.notes[sel]=v; else delete state.notes[sel];
  commit();
});
$('form').addEventListener('input',function(){saveSession(false);});
function closeSheet(){formOpen=false;formErr='';saveSession(false);render();}
$('sheet').addEventListener('click',function(e){if(e.target===this)closeSheet();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&formOpen)closeSheet();});
$('form').addEventListener('submit',function(e){
  e.preventDefault();
  var title=$('f-title').value.trim(), due=$('f-due').value;
  if(!title){formErr='Escribe el nombre del trabajo.';render();$('f-title').focus();return;}
  if(!due){formErr='Elige la fecha de entrega.';render();$('f-due').focus();return;}
  formErr='';
  state.tasks.push({id:'t'+Date.now().toString(36),title:title,subject:$('f-subject').value.trim(),due:due,detail:$('f-detail').value.trim(),done:false});
  $('f-title').value='';$('f-subject').value='';$('f-detail').value='';
  sel=due;month=due.slice(0,7);formOpen=false;
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  saveSession(false); commit();
});
})();
</script></body></html>
